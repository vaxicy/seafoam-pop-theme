<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:800px; background:#F1F0FF; position:relative;
         font-family:'Segoe UI', Arial, sans-serif; }
  .eyebrow { position:absolute; left:76px; top:60px; font-size:13px;
             letter-spacing:3.2px; color:#5B7C77; text-transform:uppercase; }
  h1 { position:absolute; left:76px; top:84px; font-weight:400;
        font-family:Georgia,'Times New Roman',serif; font-size:60px;
        letter-spacing:-.5px; color:#203F3A; }
  .sub { position:absolute; left:76px; top:176px; font-size:22px; color:#203F3A;
          opacity:.82; }
  .card { position:absolute; width:552px; height:184px; border-radius:14px;
          padding:0 34px; display:flex; flex-direction:column;
          justify-content:flex-end; padding-bottom:32px; }
  .cname { font-size:27px; font-weight:700; margin-bottom:8px; }
  .cuse { font-size:17px; opacity:.86; }

          opacity:.72; }
</style></head><body>
  <div class="eyebrow">A fresh, quiet workspace</div>
  <h1>Seafoam Pop Theme</h1>
  <div class="sub">Five colors. One calm, unhurried space.</div>
    <div class="card" style="left:76px;top:244px;background:#4DDAC2;color:#203F3A;
         border:1px solid rgba(32,63,58,.14)">
      <div class="cname">Frame</div>
      <div class="cuse">#4DDAC2 &middot; Window frame &amp; active tab</div>
    </div>
    <div class="card" style="left:652px;top:244px;background:#D2FEF3;color:#203F3A;
         border:1px solid rgba(32,63,58,.14)">
      <div class="cname">Tab</div>
      <div class="cuse">#D2FEF3 &middot; Inactive tabs</div>
    </div>
    <div class="card" style="left:76px;top:452px;background:#FFFFFF;color:#203F3A;
         border:1px solid rgba(32,63,58,.14)">
      <div class="cname">White</div>
      <div class="cuse">#FFFFFF &middot; Omnibox field</div>
    </div>
    <div class="card" style="left:652px;top:452px;background:#203F3A;color:#FFFFFF;

    &middot; No permissions required</div>
